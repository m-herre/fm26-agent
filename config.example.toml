[data]
visible_database = "data/players.sqlite3"
private_database = "data/private/labels.sqlite3"
model_reference = "data/model.json"
feature_schema = "data/feature_schema.json"
runs_directory = "runs"
prediction_cache = "data/predictions.sqlite3"
regression_reference = "data/regression-model.json"

[money]
# Multiply values stored in the save by this number to obtain displayed euros.
# Calibrate it against one known in-game transfer value before preparing data.
eur_per_internal_unit = 1.0
calibrated = false

[training]
wonderkid_threshold = 160
# Reference membership is now sampled from all exactly-labelled players; the rest are held out.
random_seed = 42
max_train_rows = 10000
max_evaluation_rows = 5000

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
temperature = 0.0
max_tool_steps = 8
final_retries = 2
max_output_tokens = 4096
# DeepSeek enables thinking by default; disable it for this small, structured POC.
thinking = false
