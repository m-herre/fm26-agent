[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm26-tabpfn-agent"
version = "1.0.0"
description = "Leakage-safe FM26 scouting agent using DeepSeek and TabPFN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "fmsave[pandas]>=0.4.7,<0.5",
  "numpy>=1.26,<3",
  "openai>=1.55,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "tabpfn-client>=0.6.1,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[project.scripts]
fm26-agent = "fm26_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "integration: reads the large FM26 save",
  "hosted: uses credentialed external APIs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
