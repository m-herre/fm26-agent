[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm26-tabpfn-agent"
version = "1.7.0"
description = "Football Manager 26 scouting agent: DeepSeek plans the search, TabPFN-3.5 estimates hidden potential with honest uncertainty"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "fmsave[pandas]>=0.5.3,<0.6",
  "numpy>=1.26,<3",
  "openai>=1.55,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "tabpfn-client>=0.6.1,<0.7",
]

[project.optional-dependencies]
local = ["tabpfn>=9,<10"]  # run TabPFN-3.5 on this computer (GPU or Apple MPS), no key needed
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[project.scripts]
fm26-agent = "fm26_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fm26_agent = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "integration: reads the large FM26 save",
  "hosted: uses credentialed external APIs",
  "value_model: runs the real market-value code (with a fake TabPFN)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
