<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 318" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="580" height="318" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2430">Same 10,000 training players, 10,000 unseen</text><text x="20" y="60" fill="#1f2430" font-weight="bold">Average error (points)</text><text x="560" y="60" text-anchor="end" fill="#6b7280">lower is better</text><text x="20" y="85" fill="#6b7280">TabPFN-3.5</text><rect x="150" y="72" width="220.6" height="18" rx="3" fill="#2563eb"/><text x="376.6" y="85" fill="#1f2430">8.6</text><text x="20" y="109" fill="#6b7280">Gradient boosting</text><rect x="150" y="96" width="274.4" height="18" rx="3" fill="#f59e0b"/><text x="430.4" y="109" fill="#1f2430">10.7</text><text x="20" y="146" fill="#1f2430" font-weight="bold">Within 10 points</text><text x="560" y="146" text-anchor="end" fill="#6b7280">higher is better</text><text x="20" y="171" fill="#6b7280">TabPFN-3.5</text><rect x="150" y="158" width="249.5" height="18" rx="3" fill="#2563eb"/><text x="405.5" y="171" fill="#1f2430">69%</text><text x="20" y="195" fill="#6b7280">Gradient boosting</text><rect x="150" y="182" width="206.3" height="18" rx="3" fill="#f59e0b"/><text x="362.3" y="195" fill="#1f2430">57%</text><text x="20" y="232" fill="#1f2430" font-weight="bold">80% range holds the truth</text><text x="560" y="232" text-anchor="end" fill="#6b7280">80% is right</text><text x="20" y="257" fill="#6b7280">TabPFN-3.5</text><rect x="150" y="244" width="296.6" height="18" rx="3" fill="#2563eb"/><text x="452.6" y="257" fill="#1f2430">82%</text><text x="20" y="281" fill="#6b7280">Gradient boosting</text><rect x="150" y="268" width="250.2" height="18" rx="3" fill="#f59e0b"/><text x="406.2" y="281" fill="#1f2430">70%</text><line x1="438.0" y1="238" x2="438.0" y2="290" stroke="#1f2430" stroke-dasharray="3 3"/></svg>
